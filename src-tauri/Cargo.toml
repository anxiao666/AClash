[package]
name = "aclash"
version = "0.1.13"
description = "AClash — lightweight Windows tray client for mihomo"
authors = ["you"]
edition = "2021"

[lib]
name = "aclash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "fs", "rt-multi-thread"] }
dirs = "5"
thiserror = "2"
base64 = "0.22"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_System_ProcessStatus"] }

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
